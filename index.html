<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A small corner of the internet by ma77di__.">
  <meta name="theme-color" content="#000000">
  <title>ma77di__</title>
  <script>
    document.documentElement.classList.add("js");
    window.setTimeout(function () {
      if (window.__typingDone) return;
      document.documentElement.classList.remove("js", "typing");
      document.querySelectorAll(".type-text").forEach(function (el) {
        var source = el.parentElement.querySelector(".sr-only");
        if (source) el.textContent = source.textContent;
        el.classList.remove("is-typing");
      });
    }, 10000);
  </script>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <img class="brand-avatar" src="images/avatar.png" alt="" width="52" height="52">
        <span class="brand-name">ma77di__</span>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="about" class="about-section">
      <div class="main-container">
        <h2 class="section-title">
          <span class="sr-only">the short version.</span>
          <span class="type-text" aria-hidden="true">the short version.</span>
        </h2>

        <div class="about-grid">
          <div class="about-content">
            <p class="about-text">
              <span class="sr-only">hello, whoever you are.</span>
              <span class="type-text" aria-hidden="true">hello, whoever you are.</span>
            </p>
            <p class="about-text">
              <span class="sr-only">this is a small corner of the internet. not much here, and that’s intentional.</span>
              <span class="type-text" aria-hidden="true">this is a small corner of the internet. not much here, and that’s intentional.</span>
            </p>
          </div>

          <div class="about-photo">
            <img src="images/profile.png" alt="Illustration of ma77di__" width="402" height="360">
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const targets = Array.from(document.querySelectorAll(".type-text"));
      const content = document.querySelector(".about-content");

      if (!targets.length) {
        root.classList.remove("js", "typing");
        window.__typingDone = true;
        return;
      }

      const texts = targets.map((el) => el.textContent.trim());

      if (content) {
        content.style.minHeight = content.getBoundingClientRect().height + "px";
      }

      targets.forEach((el) => {
        el.textContent = "\u200B";
      });

      root.classList.remove("js");
      root.classList.add("typing");

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      const type = (el, text, speed) =>
        new Promise((resolve) => {
          el.classList.add("is-typing");
          let index = 0;

          const step = () => {
            el.textContent = "\u200B" + text.slice(0, index + 1);
            const char = text.charAt(index);
            index += 1;

            if (index < text.length) {
              setTimeout(step, speed + (/[.,]/.test(char) ? 90 : 0));
            } else {
              resolve();
            }
          };

          step();
        });

      (async () => {
        await wait(220);

        for (let i = 0; i < targets.length; i += 1) {
          const speed = i === 0 ? 45 : i === 1 ? 30 : 18;
          await type(targets[i], texts[i], speed);

          if (i < targets.length - 1) {
            targets[i].classList.remove("is-typing");
            await wait(320);
          }
        }

        root.classList.remove("typing");
        window.__typingDone = true;
      })();
    })();
  </script>
</body>
</html>
